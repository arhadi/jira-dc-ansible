---
# ------------------------------------------------------------
# Jira Data Center Precheck
# ------------------------------------------------------------

# ------------------------------------------------------------
# Operating System
# ------------------------------------------------------------

- name: Verify RHEL 9
  ansible.builtin.assert:
    that:
      - ansible_distribution == "RedHat"
      - ansible_distribution_major_version == "9"
    fail_msg: "Only RHEL 9 is supported."

# ------------------------------------------------------------
# General Information
# ------------------------------------------------------------

- name: Show playbook directory
  ansible.builtin.debug:
    var: playbook_dir

- name: Show Jira variables
  ansible.builtin.debug:
    msg:
      - "jira_version={{ jira_version }}"
      - "jira_install_method={{ jira_install_method }}"
      - "jira_archive={{ jira_archive }}"
      - "jira_installer={{ jira_installer }}"

# ============================================================
# Archive Installer Precheck
# ============================================================

- name: Check Jira archive
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ jira_archive }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  register: jira_archive_stat
  when: jira_install_method == "archive"

- name: Verify Jira archive exists
  ansible.builtin.assert:
    that:
      - jira_archive_stat.stat.exists
    fail_msg: |
      Jira archive not found.

      Expected:
      {{ role_path }}/files/{{ jira_archive }}
  when: jira_install_method == "archive"

- name: Verify Jira archive SHA256 checksum
  ansible.builtin.assert:
    that:
      - jira_archive_stat.stat.checksum == jira_archive_sha256
    fail_msg: |
      Jira archive checksum verification failed.

      Expected:
      {{ jira_archive_sha256 }}

      Actual:
      {{ jira_archive_stat.stat.checksum }}
    success_msg: |
      Jira archive checksum verified successfully.
  when: jira_install_method == "archive"

# ============================================================
# Binary Installer Precheck
# ============================================================

- name: Check Jira binary installer
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ jira_installer }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  register: jira_installer_stat
  when: jira_install_method == "installer"

- name: Verify Jira binary installer exists
  ansible.builtin.assert:
    that:
      - jira_installer_stat.stat.exists
    fail_msg: |
      Jira binary installer not found.

      Expected:
      {{ role_path }}/files/{{ jira_installer }}
  when: jira_install_method == "installer"

- name: Verify Jira binary installer SHA256 checksum
  ansible.builtin.assert:
    that:
      - jira_installer_stat.stat.checksum == jira_installer_sha256
    fail_msg: |
      Jira binary installer checksum verification failed.

      Expected:
      {{ jira_installer_sha256 }}

      Actual:
      {{ jira_installer_stat.stat.checksum }}
    success_msg: |
      Jira binary installer checksum verified successfully.
  when:
    - jira_install_method == "installer"
    - jira_installer_sha256 | default('') | length > 0

# ============================================================
# Jira User and Group
# ============================================================

- name: Check Jira user
  ansible.builtin.command:
    cmd: "id {{ jira_user }}"
  register: jira_user_result
  changed_when: false
  failed_when: false

- name: Report Jira user
  ansible.builtin.debug:
    msg: >-
      {{
        'Jira user exists'
        if jira_user_result.rc == 0
        else 'Jira user does not exist (will be created)'
      }}

- name: Check Jira group
  ansible.builtin.command:
    cmd: "getent group {{ jira_group }}"
  register: jira_group_result
  changed_when: false
  failed_when: false

- name: Report Jira group
  ansible.builtin.debug:
    msg: >-
      {{
        'Jira group exists'
        if jira_group_result.rc == 0
        else 'Jira group does not exist (will be created)'
      }}

# ============================================================
# Directories
# ============================================================

- name: Check installation directory
  ansible.builtin.stat:
    path: "{{ jira_install_dir }}"
  register: install_dir

- name: Report installation directory
  ansible.builtin.debug:
    msg: >-
      {{
        'Installation directory exists'
        if install_dir.stat.exists
        else 'Installation directory does not exist (will be created)'
      }}

- name: Check Jira home directory
  ansible.builtin.stat:
    path: "{{ jira_home_dir }}"
  register: jira_home_stat

- name: Report Jira home directory
  ansible.builtin.debug:
    msg: >-
      {{
        'Jira home directory exists'
        if jira_home_stat.stat.exists
        else 'Jira home directory does not exist (will be created)'
      }}

# ============================================================
# Java
# ============================================================

- name: Check Java
  ansible.builtin.command:
    cmd: java -version
  register: java_version
  changed_when: false
  failed_when: false

- name: Report Java
  ansible.builtin.debug:
    msg: >-
      {{
        'Java is installed'
        if java_version.rc == 0
        else 'Java is not installed (will be installed)'
      }}

# ============================================================
# PostgreSQL
# ============================================================

- name: Check PostgreSQL connectivity
  ansible.builtin.wait_for:
    host: "{{ jira_db_host }}"
    port: "{{ jira_db_port }}"
    timeout: 5
  register: postgres_check
  failed_when: false
  changed_when: false

- name: Report PostgreSQL connectivity
  ansible.builtin.debug:
    msg: >-
      {{
        'PostgreSQL is reachable'
        if postgres_check.failed is not defined or not postgres_check.failed
        else 'PostgreSQL is NOT reachable'
      }}

# ============================================================
# Disk Space
# ============================================================

- name: Check free disk space on /app
  ansible.builtin.command:
    cmd: "df -BG {{ jira_base_dir }}"
  register: app_disk
  changed_when: false

- name: Show disk information
  ansible.builtin.debug:
    var: app_disk.stdout_lines

- name: Extract free disk space
  ansible.builtin.set_fact:
    app_free_gb: >-
      {{
        app_disk.stdout_lines[1]
        .split()[3]
        | regex_replace('G', '')
      }}

- name: Verify minimum free disk space
  ansible.builtin.assert:
    that:
      - (app_free_gb | int) >= 10
    fail_msg: "{{ jira_base_dir }} requires at least 10 GB of free space."
    success_msg: "{{ jira_base_dir }} has {{ app_free_gb }} GB free."
