---
# ------------------------------------------------------------
# Jira Installation Dispatcher
# ------------------------------------------------------------

- name: Display selected Jira installation method
  ansible.builtin.debug:
    msg:
      - "========================================"
      - "Jira Installation"
      - "Version : {{ jira_version }}"
      - "Method  : {{ jira_install_method }}"
      - "========================================"

# ------------------------------------------------------------
# Validate Installation Method
# ------------------------------------------------------------

- name: Validate Jira installation method
  ansible.builtin.assert:
    that:
      - jira_install_method in ['archive', 'installer']
    fail_msg: >-
      Unsupported Jira installation method '{{ jira_install_method }}'.
      Supported methods are: archive, installer
    success_msg: >-
      Jira installation method '{{ jira_install_method }}' is valid.

# ------------------------------------------------------------
# Archive Installation
# ------------------------------------------------------------

- name: Install Jira using archive
  ansible.builtin.include_tasks: install_archive.yml
  when: jira_install_method == 'archive'

# ------------------------------------------------------------
# Binary Installer Installation
# ------------------------------------------------------------

- name: Install Jira using Linux binary installer
  ansible.builtin.include_tasks: install_installer.yml
  when: jira_install_method == 'installer'
